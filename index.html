<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure and modern Family Portfolio Tracker and Wealth Dashboard. Manage, visualize, and optimize your family investments in real-time." />
  <link rel="dns-prefetch" href="https://api.mfapi.in" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Family Wealth Tracker — Portfolio Dashboard</title>
</head>

<body>
  <div id="root">
    <!-- Inline CSS skeleton for hydration boot speedup -->
    <style>
      .boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #000;
        margin: 0;
      }
      .boot-container {
        width: 100%;
        max-width: 24rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .boot-title {
        height: 1.25rem;
        width: 8rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 0.25rem;
        margin: 0 auto 1.5rem;
      }
      .boot-dots {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .boot-dot {
        width: 0.75rem;
        height: 0.75rem;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
        max-width: 16rem;
        margin: 0 auto;
      }
      .boot-key {
        width: 77px;
        height: 77px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .boot-container {
        animation: pulse 2s infinite ease-in-out;
      }
    </style>
    <div class="boot-loader">
      <div class="boot-container">
        <div class="boot-title"></div>
        <div class="boot-dots">
          <div class="boot-dot"></div>
          <div class="boot-dot"></div>
          <div class="boot-dot"></div>
          <div class="boot-dot"></div>
        </div>
        <div class="boot-grid">
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div></div>
          <div class="boot-key"></div>
          <div></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
