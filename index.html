<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Secure and modern Family Portfolio Tracker and Wealth Dashboard." />
  <link rel="preconnect" href="https://api.mfapi.in" crossorigin />
  <link rel="preconnect" href="https://api.gold-api.com" crossorigin />
  <link rel="preconnect" href="https://fkiqpjvzydmqdsuufdpc.supabase.co" crossorigin />
  <meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080c14" />
  <meta name="robots" content="index, follow" />
  <!-- iOS PWA: Enables standalone home screen mode and prevents Safari from reopening on reload -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WealthTracker" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Family Wealth Tracker — Portfolio Dashboard</title>
</head>

<body>
  <div id="root">
    <!-- Inline CSS skeleton for hydration boot speedup -->
    <style>
      .boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #080c14;
        margin: 0;
      }
      .boot-container {
        width: 100%;
        max-width: 24rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .boot-title {
        height: 1.25rem;
        width: 8rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 0.25rem;
        margin: 0 auto 1.5rem;
      }
      .boot-dots {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .boot-dot {
        width: 0.75rem;
        height: 0.75rem;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
        max-width: 16rem;
        margin: 0 auto;
      }
      .boot-key {
        width: 77px;
        height: 77px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .boot-container {
        animation: pulse 2s infinite ease-in-out;
      }
    </style>
    <div class="boot-loader">
      <div class="boot-container">
        <div class="boot-title"></div>
        <div class="boot-dots">
          <div class="boot-dot"></div>
          <div class="boot-dot"></div>
          <div class="boot-dot"></div>
          <div class="boot-dot"></div>
        </div>
        <div class="boot-grid">
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div class="boot-key"></div>
          <div></div>
          <div class="boot-key"></div>
          <div></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
